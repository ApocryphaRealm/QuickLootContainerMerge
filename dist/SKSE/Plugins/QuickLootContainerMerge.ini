; QuickLoot Container Merge. Everything here is also on the mod's page in the Apocrypha Menu Framework, where it applies at once.

[Debug]
; 2 = info. Lower numbers write more to My Games\Skyrim Special Edition\SKSE\QuickLootContainerMerge.log.
uLogLevel=2

[General]
; 0 = QuickLoot IE's window shows only what the crosshair is on.
bEnabled=1

; How far around the player to look for others of the same kind, in feet (3 to 150): bodies with bodies, containers with containers
; (both together when bMixBodiesAndContainers=1).
fInteriorFeet=10
fExteriorFeet=35

; 1 = only what the player has a line of sight to goes in the list.
bLineOfSight=0

; 1 = a body also lists the containers nearby and a container the bodies, in one list. 0 = bodies with bodies, containers with containers.
; Locked containers, merchant chests, your own storage and summoned creatures stay out either way.
bMixBodiesAndContainers=0

; 1 = items you would have to steal are listed in red with Steal, and taking them is a crime.
; 0 = they are left out: a nearby container that belongs to someone else adds nothing, and any other row that would be stealing is dropped.
; What the crosshair is on is QuickLoot IE's own list either way.
bIncludeStealing=1
