; QuickLoot Container Merge. Everything here is also on the mod's page in the Apocrypha Menu Framework, where it applies at once.

[Debug]
; 2 = info. Lower numbers write more to My Games\Skyrim Special Edition\SKSE\QuickLootContainerMerge.log.
uLogLevel=2

[General]
; 0 = QuickLoot IE's window shows only what the crosshair is on.
bEnabled=1

; How far around what the crosshair is on to look for other containers and dead bodies, in game units (100 to 3000; about 70 is
; one metre), in the same cell.
fRadius=500

; 1 = only what the player has a line of sight to goes in the list.
bLineOfSight=0
